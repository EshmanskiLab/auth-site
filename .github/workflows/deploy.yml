name: Deploy auth-site (vite + vue) (self-hosted)

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    environment: prod

    env:
      APP_NAME: auth
      APP_ROOT: /opt/apps/site/auth
      RELEASE_ID: ${{ github.run_id }}

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13

      - name: Enable pnpm
        run: corepack enable   

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check Runner setting
        run: whoami; node -v; pnpm -v;

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build

      - name: Check dist directory
        run: ls -lah dist

      - name: Create release dir
        run: |
          sudo mkdir -p $APP_ROOT/releases/$RELEASE_ID
          sudo chown -R $USER:$USER $APP_ROOT/releases

      - name: Copy source to release
        run: rsync -a ./dist/ $APP_ROOT/releases/$RELEASE_ID/

      - name: Switch current release
        run: |
          sudo ln -sfn \
            $APP_ROOT/releases/$RELEASE_ID \
            $APP_ROOT/current

      - name: Cleanup old releases
        run: |
          cd $APP_ROOT/releases
          ls -dt */ | tail -n +6 | xargs sudo rm -rf

      - name: Cleanup runner workspace
        if: always()
        run: |
          echo "Cleaning runner workspace..."
          git reset --hard
          git clean -fdx
